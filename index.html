<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anagram Board</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11100f;
      --paper: rgba(27, 25, 22, .94);
      --control: #211e1a;
      --control-hover: #2b2722;
      --ink: #f4efe3;
      --muted: #aaa197;
      --line: #3d3730;
      --board-line: #554b3e;
      --board-stripe: rgba(255,255,255,.035);
      --glow: rgba(255,255,255,.035);
      --empty: #81786e;
      --tile: #f5d997;
      --tile-edge: #bd9a55;
      --tile-shadow: #987943;
      --accent: #68a38f;
      --accent-2: #79b39f;
      --focus: rgba(104,163,143,.24);
      --selection-fill: rgba(104,163,143,.16);
      --primary-text: #101714;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f4efe3;
      --paper: rgba(255,250,240,.88);
      --control: #fffdf7;
      --control-hover: #f7f0e2;
      --ink: #1e1b18;
      --muted: #6e665d;
      --line: #d8cbbb;
      --board-line: #cbbb9f;
      --board-stripe: rgba(117,89,56,.035);
      --glow: rgba(255,255,255,.55);
      --empty: #8a8177;
      --accent: #2e5d50;
      --accent-2: #20453b;
      --focus: rgba(46,93,80,.16);
      --selection-fill: rgba(46,93,80,.12);
      --primary-text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, var(--glow), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .theme-toggle {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: .95;
      letter-spacing: -0.06em;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(77,57,35,.08);
      backdrop-filter: blur(5px);
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--control);
      color: var(--ink);
      padding: 14px 15px;
      font: inherit;
      font-size: 1rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--control);
      color: var(--ink);
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:not(.tile):hover { background: var(--control-hover); }
    button:not(.tile):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .primary {
      background: var(--accent);
      color: var(--primary-text);
      border-color: var(--accent);
      padding-inline: 20px;
    }

    .primary:hover { background: var(--accent-2); }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 12px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: .93rem;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 18px 0 10px;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: .9rem;
    }

    .board-shell {
      position: relative;
      min-height: 330px;
      border: 2px dashed var(--board-line);
      border-radius: 18px;
      background:
        linear-gradient(var(--glow), var(--glow)),
        repeating-linear-gradient(
          0deg,
          var(--board-stripe) 0,
          var(--board-stripe) 1px,
          transparent 1px,
          transparent 33px
        );
      padding: 18px;
      overflow: hidden;
    }

    .board {
      position: relative;
      min-height: 360px;
      height: 360px;
      width: 100%;
      overflow: hidden;
    }

    .empty {
      width: 100%;
      text-align: center;
      color: var(--empty);
      font-family: system-ui, sans-serif;
      padding: 98px 20px;
      pointer-events: none;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid var(--tile-edge);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.34), transparent 46%),
        var(--tile);
      box-shadow:
        0 3px 0 var(--tile-shadow),
        0 6px 11px rgba(71,50,22,.18);
      color: #2c2418;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.85rem;
      font-weight: 700;
      user-select: none;
      cursor: grab;
      touch-action: none;
      will-change: transform;
      transition: box-shadow 70ms ease;
      appearance: none;
      -webkit-appearance: none;
    }

    .tile:hover,
    .tile:focus,
    .tile:focus-visible,
    .tile:active {
      background:
        linear-gradient(145deg, rgba(255,255,255,.34), transparent 46%),
        var(--tile);
      color: #2c2418;
    }

    .tile:focus-visible {
      outline: 3px solid #f0cf7f;
      outline-offset: 3px;
      box-shadow:
        0 3px 0 var(--tile-shadow),
        0 0 0 4px rgba(240,207,127,.16),
        0 8px 14px rgba(71,50,22,.22);
    }

    .tile::after {
      content: attr(data-index);
      position: absolute;
      right: 5px;
      bottom: 3px;
      font-family: ui-monospace, monospace;
      font-size: .46rem;
      font-weight: 600;
      opacity: .42;
    }

    .tile.selected {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .tile.selected:focus-visible {
      outline-color: var(--accent);
      box-shadow:
        0 3px 0 var(--tile-shadow),
        0 0 0 4px var(--focus),
        0 8px 14px rgba(71,50,22,.22);
    }

    .tile.dragging,
    .tile.group-dragging {
      cursor: grabbing;
      z-index: 1000;
      box-shadow:
        0 4px 0 var(--tile-shadow),
        0 10px 18px rgba(71,50,22,.24);
    }

    .selection-box {
      position: absolute;
      z-index: 2000;
      pointer-events: none;
      border: 2px solid var(--accent);
      border-radius: 5px;
      background: var(--selection-fill);
    }

    @media (max-width: 700px) {
      header { align-items: start; flex-direction: column; }
      .theme-toggle { align-self: flex-start; }
      form { grid-template-columns: 1fr; }
      .primary { width: 100%; }
      .status { width: 100%; margin-left: 0; }
      .tile {
        width: 52px;
        height: 52px;
        font-size: 1.65rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>ANAGRAM BOARD</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Light mode</button>
    </header>

    <section class="panel" aria-labelledby="input-label">
      <form id="make-form">
        <label style="min-width:0">
          <span id="input-label" style="display:block;font-weight:700;margin-bottom:8px">Letters to work with</span>
          <textarea id="source" maxlength="400" placeholder="e.g. the eyes"></textarea>
        </label>
        <button class="primary" type="submit">Make tiles</button>
      </form>

      <div class="options">
        <label class="check"><input id="keep-spaces" type="checkbox"> Keep spaces as tiles</label>
        <label class="check"><input id="keep-punctuation" type="checkbox"> Keep punctuation</label>
        <label class="check"><input id="preserve-case" type="checkbox"> Preserve case</label>
      </div>

      <div class="toolbar">
        <button id="shuffle" type="button">Shuffle</button>
        <button id="reset" type="button">Reset layout</button>
        <button id="reverse" type="button">Reverse</button>
        <button id="clear" type="button">Clear</button>
        <span class="status" id="status" aria-live="polite">0 tiles</span>
      </div>

      <div class="board-shell">
        <div id="board" class="board" aria-label="Anagram tile board"></div>
      </div>

    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById('make-form');
      const source = document.getElementById('source');
      const board = document.getElementById('board');
      const status = document.getElementById('status');
      const keepSpaces = document.getElementById('keep-spaces');
      const keepPunctuation = document.getElementById('keep-punctuation');
      const preserveCase = document.getElementById('preserve-case');
      const shuffleBtn = document.getElementById('shuffle');
      const resetBtn = document.getElementById('reset');
      const reverseBtn = document.getElementById('reverse');
      const clearBtn = document.getElementById('clear');
      const themeToggle = document.getElementById('theme-toggle');

      function setTheme(theme, persist = true) {
        const next = theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        themeToggle.textContent = next === 'dark' ? 'Light mode' : 'Dark mode';
        themeToggle.setAttribute('aria-pressed', String(next === 'light'));
        if (persist) {
          try { localStorage.setItem('anagram-theme', next); } catch (_) {}
        }
      }

      let savedTheme = null;
      try { savedTheme = localStorage.getItem('anagram-theme'); } catch (_) {}
      setTheme(savedTheme === 'light' ? 'light' : 'dark', false);

      themeToggle.addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      let tiles = [];
      let nextId = 1;
      let activeDrag = null;
      let activeSelection = null;
      let selectedIds = new Set();

      function parseInput(text) {
        const chars = Array.from(text);
        const result = [];
        for (const ch of chars) {
          if (ch === ' ' || ch === '\n' || ch === '\t') {
            if (keepSpaces.checked) result.push('␠');
            continue;
          }
          if (/[\p{L}\p{N}]/u.test(ch)) {
            result.push(preserveCase.checked ? ch : ch.toUpperCase());
            continue;
          }
          if (keepPunctuation.checked) result.push(ch);
        }
        return result;
      }

      function tileSize() {
        return window.matchMedia('(max-width: 700px)').matches ? 52 : 58;
      }

      function boardBounds() {
        return {
          width: board.clientWidth,
          height: board.clientHeight,
          size: tileSize()
        };
      }

      function clampPosition(x, y) {
        const b = boardBounds();
        return {
          x: Math.max(0, Math.min(x, Math.max(0, b.width - b.size))),
          y: Math.max(0, Math.min(y, Math.max(0, b.height - b.size)))
        };
      }

      function neatPositions(count) {
        const b = boardBounds();
        const gap = 10;
        const step = b.size + gap;
        const cols = Math.max(1, Math.floor((b.width + gap) / step));
        return Array.from({ length: count }, (_, i) => ({
          x: (i % cols) * step,
          y: Math.floor(i / cols) * step
        }));
      }

      function randomNonOverlappingPositions(count) {
        const b = boardBounds();
        const size = b.size;
        const gap = 8;
        const positions = [];
        const maxX = Math.max(0, b.width - size);
        const maxY = Math.max(0, b.height - size);

        function overlapsAny(x, y) {
          return positions.some(p =>
            x < p.x + size + gap &&
            x + size + gap > p.x &&
            y < p.y + size + gap &&
            y + size + gap > p.y
          );
        }

        for (let i = 0; i < count; i++) {
          let placed = false;

          for (let attempt = 0; attempt < 800; attempt++) {
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            if (!overlapsAny(x, y)) {
              positions.push({ x, y });
              placed = true;
              break;
            }
          }

          if (!placed) {
            const fallback = neatPositions(count);
            for (let j = fallback.length - 1; j > 0; j--) {
              const k = Math.floor(Math.random() * (j + 1));
              [fallback[j], fallback[k]] = [fallback[k], fallback[j]];
            }
            return fallback;
          }
        }

        return positions;
      }

      function makeTiles(chars) {
        const positions = neatPositions(chars.length);
        return chars.map((char, i) => ({
          id: nextId++,
          char,
          x: positions[i].x,
          y: positions[i].y
        }));
      }

      function setStatus(message) {
        if (message) {
          status.textContent = message;
          return;
        }

        const tileLabel = `${tiles.length} tile${tiles.length === 1 ? '' : 's'}`;
        const selectedLabel = selectedIds.size ? ` • ${selectedIds.size} selected` : '';
        status.textContent = tileLabel + selectedLabel;
      }


      function syncSelectionClasses() {
        board.querySelectorAll('.tile').forEach(el => {
          el.classList.toggle('selected', selectedIds.has(Number(el.dataset.id)));
        });
        setStatus();
      }

      function boardPoint(e) {
        const rect = board.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(e.clientX - rect.left, rect.width)),
          y: Math.max(0, Math.min(e.clientY - rect.top, rect.height))
        };
      }

      function startSelection(e) {
        if (e.target !== board) return;
        if (e.button !== 0 && e.pointerType !== 'touch' && e.pointerType !== 'pen') return;

        e.preventDefault();
        const start = boardPoint(e);
        selectedIds.clear();
        syncSelectionClasses();

        const box = document.createElement('div');
        box.className = 'selection-box';
        box.style.left = `${start.x}px`;
        box.style.top = `${start.y}px`;
        box.style.width = '0px';
        box.style.height = '0px';
        board.appendChild(box);

        activeSelection = {
          pointerId: e.pointerId,
          startX: start.x,
          startY: start.y,
          box
        };

        board.setPointerCapture?.(e.pointerId);
      }

      function moveSelection(e) {
        if (!activeSelection || e.pointerId !== activeSelection.pointerId) return;

        const point = boardPoint(e);
        const left = Math.min(activeSelection.startX, point.x);
        const top = Math.min(activeSelection.startY, point.y);
        const right = Math.max(activeSelection.startX, point.x);
        const bottom = Math.max(activeSelection.startY, point.y);

        activeSelection.box.style.left = `${left}px`;
        activeSelection.box.style.top = `${top}px`;
        activeSelection.box.style.width = `${right - left}px`;
        activeSelection.box.style.height = `${bottom - top}px`;

        const size = tileSize();
        selectedIds = new Set(
          tiles
            .filter(t =>
              t.x < right &&
              t.x + size > left &&
              t.y < bottom &&
              t.y + size > top
            )
            .map(t => t.id)
        );

        syncSelectionClasses();
      }

      function endSelection(e) {
        if (!activeSelection || e.pointerId !== activeSelection.pointerId) return;
        activeSelection.box.remove();
        activeSelection = null;
        board.releasePointerCapture?.(e.pointerId);
        syncSelectionClasses();
      }
      function render() {
        board.replaceChildren();

        if (!tiles.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'Your tiles will appear here.';
          board.appendChild(empty);
          setStatus('0 tiles');
          return;
        }

        tiles.forEach((item, idx) => {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'tile';
          if (selectedIds.has(item.id)) tile.classList.add('selected');
          tile.dataset.id = String(item.id);
          tile.dataset.index = String(idx + 1);
          tile.setAttribute('aria-label', `Tile ${idx + 1}: ${item.char === '␠' ? 'space' : item.char}`);
          tile.textContent = item.char;
          tile.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
          tile.addEventListener('pointerdown', startDrag);
          board.appendChild(tile);
        });

        setStatus();
      }

      function startDrag(e) {
        if (e.button !== 0 && e.pointerType !== 'touch' && e.pointerType !== 'pen') return;

        const el = e.currentTarget;
        const id = Number(el.dataset.id);
        const item = tiles.find(t => t.id === id);
        if (!item) return;

        e.preventDefault();

        const isGroupDrag = selectedIds.size > 1 && selectedIds.has(id);

        if (!isGroupDrag && selectedIds.size) {
          selectedIds.clear();
          syncSelectionClasses();
        }

        const movingTiles = isGroupDrag
          ? tiles.filter(t => selectedIds.has(t.id))
          : [item];

        const size = tileSize();
        const b = boardBounds();
        const minX = Math.min(...movingTiles.map(t => t.x));
        const minY = Math.min(...movingTiles.map(t => t.y));
        const maxRight = Math.max(...movingTiles.map(t => t.x + size));
        const maxBottom = Math.max(...movingTiles.map(t => t.y + size));

        activeDrag = {
          id,
          pointerId: e.pointerId,
          isGroupDrag,
          startClientX: e.clientX,
          startClientY: e.clientY,
          minDx: -minX,
          maxDx: b.width - maxRight,
          minDy: -minY,
          maxDy: b.height - maxBottom,
          initialPositions: new Map(
            movingTiles.map(t => [t.id, { x: t.x, y: t.y }])
          )
        };

        if (isGroupDrag) {
          board.querySelectorAll('.tile.selected').forEach(tileEl => {
            tileEl.classList.add('group-dragging');
          });
        }

        el.classList.add('dragging');
        el.setPointerCapture?.(e.pointerId);

        const move = ev => moveDrag(ev);
        const up = ev => endDrag(ev);

        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);

        activeDrag.cleanup = () => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
          el.removeEventListener('pointercancel', up);
        };
      }

      function moveDrag(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;

        const rawDx = e.clientX - activeDrag.startClientX;
        const rawDy = e.clientY - activeDrag.startClientY;
        const dx = Math.max(activeDrag.minDx, Math.min(rawDx, activeDrag.maxDx));
        const dy = Math.max(activeDrag.minDy, Math.min(rawDy, activeDrag.maxDy));

        activeDrag.initialPositions.forEach((start, id) => {
          const item = tiles.find(t => t.id === id);
          const el = board.querySelector(`[data-id="${id}"]`);
          if (!item || !el) return;

          item.x = start.x + dx;
          item.y = start.y + dy;
          el.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
        });
      }

      function endDrag(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;

        const wasGroupDrag = activeDrag.isGroupDrag;
        activeDrag.cleanup?.();

        board.querySelectorAll('.tile.group-dragging, .tile.dragging').forEach(el => {
          el.classList.remove('group-dragging', 'dragging');
        });

        activeDrag = null;

        if (wasGroupDrag) {
          selectedIds.clear();
        }

        syncSelectionClasses();
      }

      function makeFromInput() {
        const parsed = parseInput(source.value);
        if (!parsed.length) {
          tiles = [];
          render();
          setStatus('Enter at least one letter or number.');
          return;
        }
        selectedIds.clear();
        tiles = makeTiles(parsed);
        render();
      }

      form.addEventListener('submit', e => {
        e.preventDefault();
        makeFromInput();
      });

      shuffleBtn.addEventListener('click', () => {
        selectedIds.clear();
        const positions = randomNonOverlappingPositions(tiles.length);
        tiles.forEach((t, i) => {
          t.x = positions[i].x;
          t.y = positions[i].y;
        });
        render();
      });

      resetBtn.addEventListener('click', () => {
        selectedIds.clear();
        const positions = neatPositions(tiles.length);
        tiles.forEach((t, i) => {
          t.x = positions[i].x;
          t.y = positions[i].y;
        });
        render();
      });

      reverseBtn.addEventListener('click', () => {
        selectedIds.clear();
        tiles.reverse();
        const positions = neatPositions(tiles.length);
        tiles.forEach((t, i) => {
          t.x = positions[i].x;
          t.y = positions[i].y;
        });
        render();
      });

      clearBtn.addEventListener('click', () => {
        source.value = '';
        selectedIds.clear();
        tiles = [];
        render();
        source.focus();
      });

      board.addEventListener('pointerdown', startSelection);
      board.addEventListener('pointermove', moveSelection);
      board.addEventListener('pointerup', endSelection);
      board.addEventListener('pointercancel', endSelection);

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          tiles.forEach(t => {
            const pos = clampPosition(t.x, t.y);
            t.x = pos.x;
            t.y = pos.y;
          });
          render();
        }, 80);
      });

      render();
    })();
  </script>
</body>
</html>
